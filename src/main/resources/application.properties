# Secrets and machine-specific values live in a local, gitignored .env
# file (see .env.example for the required keys), not in this file — so
# this file has nothing sensitive in it and is safe to commit.
spring.config.import=optional:file:.env[.properties]

spring.application.name=lpm

# Google Calendar configuration
google.calendar.id=${GOOGLE_CALENDAR_ID}
google.api.key=${GOOGLE_API_KEY}

# Extra Google Calendars shown on the site as informational only (dot +
# tooltip on the grid), never open for sign-up — see CalendarProperties and
# GoogleCalendarService#getEvents. Each must be public (or at least
# readable with the API key above), or it's silently skipped. To show
# another calendar, add a line here (any name works, it's just a label)
# plus its matching env var.
liga.calendars.extra.eventos-pauper=${GOOGLE_CALENDAR_ID_EVENTOS_PAUPER:}
liga.calendars.extra.holidays-uy=${GOOGLE_CALENDAR_ID_HOLIDAYS_UY:}

server.port=${SERVER_PORT:8080}

# WhatsApp number that finished cart orders and deck reservations are sent
# to, international format without "+" or spaces (e.g. 598 + area + number
# for Uruguay).
liga.whatsapp.number=${LIGA_WHATSAPP_NUMBER}

# Shared secret to view deck reservations at /prestamo-mazos/reservas?token=...
# Leave LIGA_ADMIN_TOKEN unset (or blank) in .env to disable that page entirely.
liga.admin.token=${LIGA_ADMIN_TOKEN:}

# Where EventSignupStore and DeckReservationStore persist their JSON files
# (signups.json, deck-reservations.json) so sign-ups and deck reservations
# survive an app restart/redeploy. Relative paths are resolved against the
# JVM's working directory. In Docker this needs a volume mounted at that
# path to actually persist across container recreation — otherwise it's
# just as ephemeral as the old in-memory-only behavior. Leave
# LIGA_DATA_DIR blank to disable the files and go back to in-memory only.
liga.data.dir=${LIGA_DATA_DIR:./data}

# Turn a whole site section on or off without a deploy: set to false to
# hide it from the home page and 404 its URL. Any section left out here
# All sections default to enabled.
# liga.sections.enabled.calendario=false
liga.sections.enabled.accesorios=false
liga.sections.enabled.tokens=false
liga.sections.enabled.merchandising=false
liga.sections.enabled.colaboradores=false
#liga.sections.enabled.mazos=false
#liga.sections.enabled.clasificacion=false

# Same switch for the shopping cart (/carrito and its "agregar al carrito"
# buttons), which isn't a section of its own on the home page.
liga.sections.enabled.carrito=false

# The league's current-season standings page on legapauperitalia.it's
# shared "Pauper League Manager" tool — update this each season to the new
# season's URL. Used by the Clasificacion section.
liga.clasificacion.url=${LIGA_CLASIFICACION_URL:https://www.legapauperitalia.it/seasons/259}

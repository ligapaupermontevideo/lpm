<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" th:href="@{/favicon-32x32.png}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <title>Liga Pauper Montevideo - Reserva de deck</title>
    <link rel="preload" th:href="@{/fonts/Beleren2016-Bold.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" th:href="@{/fonts/Beleren2016SmallCaps-Bold.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header('Reserva de deck')}"></header>

<main>
    <section class="reservas-section">
        <p th:if="${errorMessage}" class="reserva-toast reserva-toast-error" th:text="${errorMessage}">Error</p>

        <p class="deck-choice-intro">
            Eleg&iacute; un deck para el <strong th:text="${fechaLabel}">fecha</strong>.
        </p>

        <div th:if="${#lists.isEmpty(decks)}" class="no-events">
            No se pudo cargar la lista de decks en este momento. Volve a intentar mas tarde.
        </div>

        <div th:unless="${#lists.isEmpty(decks)}" class="deck-list">
            <ul>
                <li th:each="deck : ${decks}" class="deck-row">
                    <div class="deck-row-info">
                        <a class="deck-name-link" th:href="${deck.url}" target="_blank" rel="noopener"
                           th:title="|Ver ${deck.name} en Moxfield (se abre en otra pestaña)|">
                            <span th:text="${deck.name}">Deck</span>
                            <span th:replace="~{fragments/icons :: icon('external-link')}"></span>
                        </a>
                        <span class="deck-colors">
                            <th:block th:each="color : ${deck.colors}">
                                <span th:replace="~{fragments/icons :: mana(${color})}"></span>
                            </th:block>
                        </span>
                    </div>
                    <form method="post" th:action="@{/calendario/anotarse/deck/reservar}">
                        <input type="hidden" name="nombre" th:value="${nombre}"/>
                        <input type="hidden" name="cedula" th:value="${cedula}"/>
                        <input type="hidden" name="fecha" th:value="${fecha}"/>
                        <input type="hidden" name="deckId" th:value="${deck.id}"/>
                        <button type="submit" class="btn-add deck-reserve-btn"
                                th:disabled="${reservedDeckIds.contains(deck.id)}"
                                th:text="${reservedDeckIds.contains(deck.id)} ? 'Reservado' : 'Reservar'">Reservar</button>
                    </form>
                </li>
            </ul>
        </div>

        <a class="back-home" th:href="@{/calendario/anotarse(fecha=${fecha})}">&larr; Volver</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>

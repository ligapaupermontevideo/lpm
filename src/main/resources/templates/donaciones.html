<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" th:href="@{/favicon-32x32.png}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <title th:text="|Liga Pauper Montevideo - ${section.name}|">Liga Pauper Montevideo</title>
    <link rel="preload" th:href="@{/fonts/Beleren2016-Bold.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" th:href="@{/fonts/Beleren2016SmallCaps-Bold.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header(${section.name})}"></header>

<main>
    <section class="donaciones-section">
        <p class="donaciones-intro">
            Las donaciones ayudan a cubrir premios, accesorios y los gastos de organizar la liga.
            Se procesan a través de PayPal, en dólares.
        </p>

        <div class="donation-grid">
            <a class="donation-card" th:each="option : ${donationOptions}"
               th:href="${option.url}" target="_blank" rel="noopener">
                <span th:replace="~{fragments/icons :: icon('heart')}"></span>
                <span class="donation-amount" th:text="${option.label}">U$S 5</span>
            </a>
        </div>

        <a class="back-home" th:href="@{/}">&larr; Volver al inicio</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Section icons as inline pixel-art SVG — a grid of flat rects on a 16x16
  viewBox, no curves or strokes, so they read as blocky 8-bit sprites at
  any size. Colors reference the palette in style.css (var(--color-...))
  so retheming the site also retones the icons. Drawn by the browser
  itself instead of an OS emoji font, so they look identical on a phone
  and on a desktop browser, unlike emoji. Include with:
    <span th:replace="~{fragments/icons :: icon(${section.icon})}"></span>
-->
<span th:fragment="icon(name)" th:switch="${name}" class="icon">
    <svg th:case="'calendar'" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="2" y="4" width="12" height="10" fill="var(--color-accent-strong)"/>
        <rect x="3" y="8" width="10" height="5" fill="var(--color-accent-tint)"/>
        <rect x="5" y="2" width="1" height="3" fill="var(--color-accent-strong)"/>
        <rect x="10" y="2" width="1" height="3" fill="var(--color-accent-strong)"/>
        <rect x="7" y="10" width="2" height="2" fill="var(--color-text)"/>
    </svg>
    <svg th:case="'cards'" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="6" y="2" width="8" height="11" fill="var(--color-accent-strong)"/>
        <rect x="7" y="3" width="6" height="9" fill="var(--color-accent)"/>
        <rect x="2" y="4" width="8" height="11" fill="var(--color-accent-strong)"/>
        <rect x="3" y="5" width="6" height="9" fill="var(--color-accent-tint)"/>
        <rect x="5" y="8" width="2" height="2" fill="var(--color-text)"/>
    </svg>
    <svg th:case="'bag'" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="7" y="2" width="2" height="3" fill="var(--color-accent-strong)"/>
        <rect x="3" y="6" width="10" height="9" fill="var(--color-accent-strong)"/>
        <rect x="4" y="7" width="8" height="7" fill="var(--color-accent)"/>
        <rect x="5" y="10" width="6" height="1" fill="var(--color-text)"/>
    </svg>
    <svg th:case="'coin'" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="6" y="3" width="4" height="1" fill="var(--color-accent-strong)"/>
        <rect x="4" y="4" width="8" height="1" fill="var(--color-accent-strong)"/>
        <rect x="3" y="5" width="10" height="6" fill="var(--color-accent-strong)"/>
        <rect x="4" y="11" width="8" height="1" fill="var(--color-accent-strong)"/>
        <rect x="6" y="12" width="4" height="1" fill="var(--color-accent-strong)"/>
        <rect x="7" y="4" width="2" height="1" fill="var(--color-text)"/>
        <rect x="5" y="5" width="6" height="1" fill="var(--color-text)"/>
        <rect x="4" y="6" width="8" height="4" fill="var(--color-text)"/>
        <rect x="5" y="10" width="6" height="1" fill="var(--color-text)"/>
        <rect x="7" y="11" width="2" height="1" fill="var(--color-text)"/>
        <rect x="7" y="7" width="2" height="2" fill="var(--color-accent-strong)"/>
    </svg>
    <svg th:case="'shirt'" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="6" y="3" width="4" height="2" fill="var(--color-accent-strong)"/>
        <rect x="1" y="4" width="3" height="4" fill="var(--color-accent-strong)"/>
        <rect x="12" y="4" width="3" height="4" fill="var(--color-accent-strong)"/>
        <rect x="2" y="5" width="1" height="2" fill="var(--color-accent)"/>
        <rect x="13" y="5" width="1" height="2" fill="var(--color-accent)"/>
        <rect x="4" y="6" width="8" height="8" fill="var(--color-accent-strong)"/>
        <rect x="5" y="7" width="6" height="6" fill="var(--color-accent)"/>
        <rect x="7" y="9" width="2" height="2" fill="var(--color-text)"/>
    </svg>
    <svg th:case="'cart'" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="4" y="1" width="1" height="4" fill="var(--color-accent-strong)"/>
        <rect x="11" y="1" width="1" height="4" fill="var(--color-accent-strong)"/>
        <rect x="4" y="1" width="8" height="1" fill="var(--color-accent-strong)"/>
        <rect x="2" y="5" width="12" height="7" fill="var(--color-accent-strong)"/>
        <rect x="3" y="6" width="10" height="5" fill="var(--color-accent)"/>
        <rect x="6" y="8" width="4" height="3" fill="var(--color-text)"/>
    </svg>
</span>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Section icons as inline SVG, drawn by the browser itself instead of an
  OS emoji font — so they look identical on a phone and on a desktop
  browser, unlike emoji. Include with:
    <span th:replace="fragments/icons :: icon(${section.icon})"></span>
-->
<span th:fragment="icon(name)" th:switch="${name}" class="icon">
    <svg th:case="'calendar'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
    </svg>
    <svg th:case="'cards'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="3" width="12" height="16" rx="2" transform="rotate(8 13 11)"/>
        <rect x="4" y="5" width="12" height="16" rx="2"/>
    </svg>
    <svg th:case="'bag'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V8Z"/>
        <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
        <path d="M9 12h6"/>
    </svg>
    <svg th:case="'coin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="5"/>
    </svg>
    <svg th:case="'shirt'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4 4 7l2 3 2-1v10h8V9l2 1 2-3-4-3-2 2-2-2Z"/>
    </svg>
</span>

</body>
</html>

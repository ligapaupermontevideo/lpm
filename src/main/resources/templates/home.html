<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Pauper Montevideo - Inicio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="fragments/layout :: header('Selecciona una seccion')"></header>

<main>
    <section class="home-section">
        <div class="section-grid">
            <a th:each="section : ${sections}"
               class="section-card"
               th:href="@{${section.url}}">
                <span class="section-icon" th:text="${section.icon}">&#128197;</span>
                <span class="section-name" th:text="${section.name}">Nombre</span>
                <span class="section-desc" th:text="${section.description}">Descripcion</span>
            </a>
        </div>
    </section>
</main>

<footer th:replace="fragments/layout :: footer"></footer>

</body>
</html>

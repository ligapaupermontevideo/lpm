<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Liga Pauper Montevideo - ${section.name}|">Liga Pauper Montevideo</title>
    <link rel="preload" th:href="@{/fonts/Beleren2016-Bold.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="preload" th:href="@{/fonts/Beleren2016SmallCaps-Bold.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header(${section.name})}"></header>

<main>
    <section class="product-section">
        <p th:if="${added}" class="cart-toast">Se agrego al carrito.</p>

        <div th:if="${#lists.isEmpty(products)}" class="no-events">
            Todavia no hay productos cargados.
        </div>

        <div th:unless="${#lists.isEmpty(products)}" class="product-grid">
            <div class="product-card" th:each="product : ${products}">
                <span th:replace="~{fragments/icons :: icon(${product.icon})}"></span>
                <h3 class="product-name" th:text="${product.name}">Producto</h3>
                <p class="product-desc" th:text="${product.description}">Descripcion</p>
                <p class="product-price" th:text="|$ ${product.price}|">$0</p>
                <form method="post" th:action="@{/carrito/agregar}">
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <input type="hidden" name="from" th:value="${section.url}"/>
                    <button type="submit" class="btn-add">Agregar al carrito</button>
                </form>
            </div>
        </div>

        <a class="back-home" th:href="@{/}">&larr; Volver al inicio</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
